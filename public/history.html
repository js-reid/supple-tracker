<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History - Supple Tracker</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <div class="header-top">
      <h1 class="title-box">💊 Supple Tracker 📊</h1>
      <button id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode">
        <span class="sun">☀️</span>
        <span class="moon">🌙</span>
      </button>
    </div>
    <nav>
      <a href="/">Home</a>
      <a href="/history">History</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>

  <main>
    <div class="history-header">
      <h2>Supplement History</h2>
      <div class="export-buttons">
        <button class="btn btn-secondary" id="export-csv-btn">Export CSV</button>
        <button class="btn btn-secondary" id="export-json-btn">Export JSON</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <div class="filter-group">
        <label for="supplement-filter">Supplement</label>
        <select id="supplement-filter">
          <option value="">All Supplements</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="date-from">From</label>
        <input type="date" id="date-from">
      </div>

      <div class="filter-group">
        <label for="date-to">To</label>
        <input type="date" id="date-to">
      </div>

      <div class="filter-group search-group">
        <label for="search">Search</label>
        <input type="text" id="search" placeholder="Search notes...">
      </div>

      <div class="filter-actions">
        <button class="btn btn-secondary" id="clear-filters-btn">Clear</button>
      </div>
    </div>

    <!-- Logs list -->
    <div id="logs-container">
      <div class="logs-list" id="logs-list">
        <!-- Logs will be dynamically inserted here -->
      </div>

      <div id="empty-state" class="empty-state" style="display: none;">
        <p>No logs found matching your filters.</p>
      </div>
    </div>
  </main>

  <!-- Modal for editing log -->
  <div id="edit-log-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Edit Log</h2>
        <button class="close-btn" onclick="closeEditModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="edit-log-form">
          <input type="hidden" id="log-id" name="id">

          <div class="form-group">
            <label for="edit-supplement">Supplement</label>
            <input type="text" id="edit-supplement" disabled>
          </div>

          <div class="form-group">
            <label for="edit-taken-at">Time Taken *</label>
            <input type="datetime-local" id="edit-taken-at" name="taken_at" required>
          </div>

          <div class="form-group">
            <label for="edit-dosage">Dosage *</label>
            <input type="text" id="edit-dosage" name="dosage" placeholder="e.g., 500mg, 2 pills" required>
          </div>

          <div class="form-group">
            <label for="edit-notes">Notes</label>
            <textarea id="edit-notes" name="notes" rows="3" placeholder="Optional notes"></textarea>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete confirmation modal -->
  <div id="delete-log-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Delete Log?</h2>
        <button class="close-btn" onclick="closeDeleteModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p id="delete-log-message">Are you sure you want to delete this log entry?</p>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-delete-log-btn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/history.js"></script>
</body>
</html>
