<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supple Tracker</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <div class="header-top">
      <h1 class="title-box">💊 Supple Tracker 📊</h1>
      <button id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode">
        <span class="sun">☀️</span>
        <span class="moon">🌙</span>
      </button>
    </div>
    <nav>
      <a href="/">Home</a>
      <a href="/history">History</a>
      <a href="/calendar">Calendar</a>
      <a href="/settings">Settings</a>
      <a href="/api-docs">API</a>
    </nav>
  </header>

  <main>
    <div id="supplements-grid" class="supplements-grid">
      <!-- Supplement buttons will be dynamically inserted here -->
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
      <p>No supplements configured yet.</p>
      <a href="/settings" class="btn btn-primary">Add Supplements</a>
    </div>
  </main>

  <!-- Modal for logging supplement -->
  <div id="log-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Log Supplement</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="log-form">
          <input type="hidden" id="supplement-id" name="supplement_id">

          <div class="form-group">
            <label for="dosage">Dosage *</label>
            <input type="text" id="dosage" name="dosage" placeholder="e.g., 500mg, 2 pills" required>
          </div>

          <div class="form-group">
            <label for="taken-at">Time Taken</label>
            <input type="datetime-local" id="taken-at" name="taken_at">
          </div>

          <div class="form-group">
            <label for="notes">Notes (optional)</label>
            <textarea id="notes" name="notes" rows="3" placeholder="e.g., with food, felt nauseous"></textarea>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Log It</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/shared.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
